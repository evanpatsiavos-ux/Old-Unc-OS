name: Build Dad's OS ISO (Debian 12 Windows XP)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Debian 12 XP ISO for HP Pavilion g6
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install Build Tools
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso isolinux syslinux-efi \
            grub-pc-bin grub-efi-amd64-bin mtools curl wget git ca-certificates

      - name: Assemble Live-Build Workspace & Filesystem Overlay
        run: |
          mkdir -p live-build-workspace
          cd live-build-workspace

          # Configure Debian 12 Bookworm
          sudo lb config \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --bootloaders "syslinux,grub-efi" \
            --memtest none \
            --iso-application "Dad's OS Windows XP Edition" \
            --iso-publisher "Son's Tech Lab" \
            --iso-volume "DADOS_12_XP" \
            --linux-flavours amd64 \
            --system live

          # Inject Package Manifest
          sudo mkdir -p config/package-lists
          sudo tee config/package-lists/dados.list.chroot << 'EOF'
          linux-image-amd64
          intel-microcode
          firmware-misc-nonfree
          firmware-realtek
          firmware-atheros
          firmware-iwlwifi
          firmware-brcm80211
          libgl1-mesa-dri
          libglx-mesa0
          mesa-va-drivers
          mesa-vdpau-drivers
          xserver-xorg-core
          xserver-xorg-video-all
          xserver-xorg-input-all
          calamares
          calamares-settings-debian
          grub-pc
          grub-efi-amd64-signed
          shim-signed
          parted
          dosfstools
          e2fsprogs
          ntfs-3g
          plymouth
          plymouth-themes
          xfce4
          xfce4-goodies
          xfce4-whiskermenu-plugin
          xfce4-pulseaudio-plugin
          thunar
          lightdm
          lightdm-gtk-greeter
          network-manager-gnome
          pavucontrol
          pulseaudio
          gnome-software
          gnome-software-plugin-flatpak
          flatpak
          packagekit
          unattended-upgrades
          firefox-esr
          libreoffice-writer
          libreoffice-calc
          libreoffice-gtk3
          vlc
          galculator
          preload
          wine
          wine64
          fonts-wine
          EOF

          # Create Filesystem Overlays
          sudo mkdir -p config/includes.chroot/etc/sysctl.d \
                        config/includes.chroot/etc/polkit-1/rules.d \
                        config/includes.chroot/etc/apt/apt.conf.d \
                        config/includes.chroot/etc/firefox-esr/policies \
                        config/includes.chroot/etc/skel/Desktop \
                        config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml \
                        config/includes.chroot/usr/bin \
                        config/includes.chroot/usr/lib/libreoffice/share/registry \
                        config/includes.chroot/usr/share/applications \
                        config/includes.chroot/etc/calamares/branding/default \
                        config/includes.chroot/etc/systemd/user

          # 1. Sysctl for 16GB RAM + HDD
          sudo tee config/includes.chroot/etc/sysctl.d/99-sysctl.conf << 'EOF'
          vm.swappiness = 10
          vm.vfs_cache_pressure = 50
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 10
          EOF

          # 2. Polkit Zero-Password
          sudo tee config/includes.chroot/etc/polkit-1/rules.d/49-dad-nopasswd.rules << 'EOF'
          polkit.addRule(function(action, subject) {
              if (subject.local && subject.active) {
                  if (action.id.indexOf("org.freedesktop.packagekit.") === 0 ||
                      action.id.indexOf("org.debian.apt.") === 0 ||
                      action.id.indexOf("org.freedesktop.flatpak.") === 0 ||
                      action.id.indexOf("org.freedesktop.udisks2.") === 0 ||
                      action.id.indexOf("org.freedesktop.login1.") === 0 ||
                      action.id.indexOf("org.freedesktop.NetworkManager.") === 0) {
                      return polkit.Result.YES;
                  }
              }
          });
          EOF

          # 3. Wine OpenGL Launcher (Hardware Safe for Intel HD 3000)
          sudo tee config/includes.chroot/usr/bin/wine-runner << 'EOF'
          #!/bin/sh
          export WINE_D3D_CONFIG="renderer=gl,csmt=1,max_gl_version=3.3"
          export WINEDLLOVERRIDES="dxgi=builtin;d3d11=builtin;d3d10core=builtin;d3d9=builtin"
          case "$1" in
              *.msi|*.MSI) exec wine msiexec /i "$@" ;;
              *)           exec wine start /unix "$@" ;;
          esac
          EOF
          sudo chmod +x config/includes.chroot/usr/bin/wine-runner

          # 4. Hide Terminals from Start Menu
          for app in xfce4-terminal debian-xterm debian-uxterm; do
            sudo tee config/includes.chroot/usr/share/applications/${app}.desktop << EOF
          [Desktop Entry]
          Type=Application
          NoDisplay=true
          Hidden=true
          EOF
          done

          # 5. Firefox uBlock Origin Policy
          sudo tee config/includes.chroot/etc/firefox-esr/policies/policies.json << 'EOF'
          {
            "policies": {
              "ExtensionSettings": {
                "uBlock0@raymondhill.net": {
                  "installation_mode": "force_installed",
                  "install_url": "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
                }
              },
              "DisableAppUpdate": true,
              "DontCheckDefaultBrowser": true
            }
          }
          EOF

          # 6. LibreOffice .docx / .xlsx defaults
          sudo tee config/includes.chroot/usr/lib/libreoffice/share/registry/ms-compat.xcd << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <oor:data xmlns:oor="http://openoffice.org/2001/registry" xmlns:xs="http://www.w3.org/2001/XMLSchema">
            <oor:component-data oor:package="org.openoffice.Setup" oor:name="Setup">
              <node oor:name="Office">
                <node oor:name="Factories">
                  <node oor:name="com.sun.star.text.TextDocument">
                    <prop oor:name="ooSetupFactoryDefaultFilter" oor:type="xs:string"><value>MS Word 2007 XML</value></prop>
                  </node>
                  <node oor:name="com.sun.star.sheet.SpreadsheetDocument">
                    <prop oor:name="ooSetupFactoryDefaultFilter" oor:type="xs:string"><value>Calc MS Excel 2007 XML</value></prop>
                  </node>
                </node>
              </node>
            </oor:component-data>
          </oor:data>
          EOF

          # 7. Desktop Shortcuts
          sudo tee config/includes.chroot/etc/skel/Desktop/my-computer.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=My Computer
          Exec=thunar computer:///
          Icon=computer
          EOF

          sudo tee config/includes.chroot/etc/skel/Desktop/my-documents.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=My Documents
          Exec=thunar Documents
          Icon=folder-documents
          EOF

          sudo tee config/includes.chroot/etc/skel/Desktop/recycle-bin.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Recycle Bin
          Exec=thunar trash:///
          Icon=user-trash
          EOF

          sudo tee config/includes.chroot/etc/skel/Desktop/remote-help.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Remote Help (Call Son)
          Exec=rustdesk
          Icon=preferences-desktop-remote-desktop
          EOF

          sudo tee config/includes.chroot/etc/skel/Desktop/software-store.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Software Store
          Exec=gnome-software
          Icon=org.gnome.Software
          EOF
          sudo chmod +x config/includes.chroot/etc/skel/Desktop/*.desktop

          # 8. Mask tracker disk indexer
          sudo ln -sf /dev/null config/includes.chroot/etc/systemd/user/tracker-miner-fs-3.service
          sudo ln -sf /dev/null config/includes.chroot/etc/systemd/user/tracker-extract-3.service

          # 9. Hook for 32-bit Wine, RustDesk, Theme & Bliss
          sudo mkdir -p config/hooks/live
          sudo tee config/hooks/live/99-setup.chroot << 'EOF'
          #!/bin/sh
          set -e
          dpkg --add-architecture i386 || true
          apt-get update -y || true
          apt-get install -y --no-install-recommends wine32:i386 || true

          # Bliss Wallpaper
          mkdir -p /usr/share/backgrounds
          curl -fsSL -o /usr/share/backgrounds/bliss.jpg "https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png" || true

          # RustDesk
          curl -fsSL -o /tmp/rustdesk.deb "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb" || true
          if [ -f /tmp/rustdesk.deb ]; then
            apt-get install -y /tmp/rustdesk.deb || dpkg -i /tmp/rustdesk.deb || true
            rm -f /tmp/rustdesk.deb
          fi

          # XP Theme
          mkdir -p /usr/share/themes /usr/share/icons
          git clone --depth 1 https://github.com/B00merang-Project/Windows-XP.git /usr/share/themes/Windows-XP-Luna || true
          git clone --depth 1 https://github.com/B00merang-Artwork/Windows-XP.git /usr/share/icons/Windows-XP || true
          EOF
          sudo chmod +x config/hooks/live/99-setup.chroot

      - name: Build Hybrid ISO
        run: |
          cd live-build-workspace
          sudo lb build
          if [ -f live-image-amd64.hybrid.iso ]; then
            mv live-image-amd64.hybrid.iso ../os-installer.iso
          elif [ -f live-image-amd64.iso ]; then
            mv live-image-amd64.iso ../os-installer.iso
          fi

      - name: Upload ISO for Download
        uses: actions/upload-artifact@v4
        with:
          name: DadOS-Windows-XP-ISO
          path: os-installer.iso
          retention-days: 7
