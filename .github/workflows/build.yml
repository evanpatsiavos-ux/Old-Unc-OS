name: Build Dad's OS ISO (Debian 12 Windows XP)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Compile Universal Dual-Boot (UEFI + MBR) Debian 12 XP ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Build Universal Dual-Boot ISO in Native Debian 12 Container
        run: |
          docker run --privileged --rm -v $(pwd):/workspace debian:bookworm bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              live-build debootstrap squashfs-tools xorriso isolinux syslinux-efi \
              grub-pc-bin grub-efi-amd64-bin mtools curl wget git ca-certificates \
              apt-utils dosfstools

            mkdir -p /workspace/live-build-workspace
            cd /workspace/live-build-workspace

            # Configure for BOTH UEFI and Legacy MBR/BIOS
            lb config \
              --distribution bookworm \
              --archive-areas "main contrib non-free non-free-firmware" \
              --architectures amd64 \
              --binary-images iso-hybrid \
              --bootloaders "grub-pc grub-efi" \
              --memtest none \
              --iso-application "Dad OS Windows XP Edition" \
              --iso-volume "DADOS_12_XP" \
              --linux-flavours amd64 \
              --system live

            mkdir -p config/package-lists
            printf "%s\n" \
              "linux-image-amd64" \
              "intel-microcode" \
              "firmware-misc-nonfree" \
              "firmware-realtek" \
              "firmware-atheros" \
              "firmware-iwlwifi" \
              "libgl1-mesa-dri" \
              "libglx-mesa0" \
              "xserver-xorg-core" \
              "xserver-xorg-video-all" \
              "calamares" \
              "calamares-settings-debian" \
              "grub-pc" \
              "grub-efi-amd64-signed" \
              "shim-signed" \
              "plymouth" \
              "plymouth-themes" \
              "xfce4" \
              "xfce4-goodies" \
              "xfce4-whiskermenu-plugin" \
              "xfce4-pulseaudio-plugin" \
              "thunar" \
              "lightdm" \
              "lightdm-gtk-greeter" \
              "network-manager-gnome" \
              "pavucontrol" \
              "pulseaudio" \
              "gnome-software" \
              "gnome-software-plugin-flatpak" \
              "flatpak" \
              "firefox-esr" \
              "libreoffice-writer" \
              "libreoffice-calc" \
              "libreoffice-gtk3" \
              "vlc" \
              "preload" \
              "wine" \
              "wine64" \
              "fonts-wine" > config/package-lists/dados.list.chroot

            mkdir -p config/includes.chroot/etc/sysctl.d \
                     config/includes.chroot/etc/polkit-1/rules.d \
                     config/includes.chroot/etc/firefox-esr/policies \
                     config/includes.chroot/etc/skel/Desktop \
                     config/includes.chroot/usr/bin \
                     config/includes.chroot/usr/lib/libreoffice/share/registry \
                     config/includes.chroot/usr/share/applications \
                     config/includes.chroot/etc/systemd/user \
                     config/includes.chroot/usr/share/themes \
                     config/includes.chroot/usr/share/icons \
                     config/includes.chroot/usr/share/backgrounds \
                     config/includes.chroot/usr/share/images/desktop-base \
                     config/includes.chroot/etc/xdg/xfce4/xfconf/xfce-perchannel-xml \
                     config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml \
                     config/includes.chroot/etc/xdg/xfce4/panel \
                     config/includes.chroot/etc/gtk-3.0 \
                     config/includes.chroot/etc/skel/.config/gtk-3.0

            # 1. Download Theme, Icons, and Bliss directly into filesystem
            curl -fsSL -o config/includes.chroot/usr/share/backgrounds/bliss.jpg "https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png" || true
            cp config/includes.chroot/usr/share/backgrounds/bliss.jpg config/includes.chroot/usr/share/images/desktop-base/default || true

            git clone --depth 1 https://github.com/B00merang-Project/Windows-XP.git config/includes.chroot/usr/share/themes/Windows-XP-Luna || true
            git clone --depth 1 https://github.com/B00merang-Artwork/Windows-XP.git config/includes.chroot/usr/share/icons/Windows-XP || true

            # 2. Base64 Injection for 1:1 Windows XP Luna Panel, GTK Theme, Window Manager, and Desktop
            # Panel XML (Single bottom taskbar with Green Start Button, Windows Tabs, System Tray)
            echo "" | base64 -d > config/includes.chroot/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
            cp config/includes.chroot/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
            cp config/includes.chroot/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml config/includes.chroot/etc/xdg/xfce4/panel/default.xml

            # GTK CSS: Windows XP Luna Royal Blue Taskbar & Green Start Button
            echo "" | base64 -d > config/includes.chroot/etc/gtk-3.0/gtk.css
            cp config/includes.chroot/etc/gtk-3.0/gtk.css config/includes.chroot/etc/skel/.config/gtk-3.0/gtk.css

            # Settings XML: Force Windows-XP-Luna GTK Theme & Windows-XP Icons
            echo "" | base64 -d > config/includes.chroot/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
            cp config/includes.chroot/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml

            # XFWM4 XML: Royal Blue Window Borders with Minimize/Maximize/Red Close Button
            echo "" | base64 -d > config/includes.chroot/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml

            # 3. Sysctl for 16GB RAM + HDD
            printf "%s\n" \
              "vm.swappiness = 10" \
              "vm.vfs_cache_pressure = 50" > config/includes.chroot/etc/sysctl.d/99-sysctl.conf

            # 4. Polkit Zero-Password
            printf "%s\n" \
              "polkit.addRule(function(action, subject) {" \
              "    if (subject.local && subject.active) {" \
              "        return polkit.Result.YES;" \
              "    }" \
              "});" > config/includes.chroot/etc/polkit-1/rules.d/49-dad-nopasswd.rules

            # 5. Wine OpenGL Launcher (Hardware Safe for Intel HD 3000)
            printf "%s\n" \
              "#!/bin/sh" \
              "export WINE_D3D_CONFIG=\"renderer=gl,csmt=1,max_gl_version=3.3\"" \
              "export WINEDLLOVERRIDES=\"dxgi=builtin;d3d11=builtin;d3d10core=builtin;d3d9=builtin\"" \
              "case \"\$1\" in" \
              "    *.msi|*.MSI) exec wine msiexec /i \"\$@\" ;;" \
              "    *)           exec wine start /unix \"\$@\" ;;" \
              "esac" > config/includes.chroot/usr/bin/wine-runner
            chmod +x config/includes.chroot/usr/bin/wine-runner

            # 6. Hide Terminals from Start Menu
            for app in xfce4-terminal debian-xterm debian-uxterm; do
              printf "%s\n" "[Desktop Entry]" "Type=Application" "NoDisplay=true" "Hidden=true" > config/includes.chroot/usr/share/applications/${app}.desktop
            done

            # 7. Desktop Shortcuts
            printf "%s\n" "[Desktop Entry]" "Type=Application" "Name=My Computer" "Exec=thunar computer:///" "Icon=computer" > config/includes.chroot/etc/skel/Desktop/my-computer.desktop
            printf "%s\n" "[Desktop Entry]" "Type=Application" "Name=My Documents" "Exec=thunar Documents" "Icon=folder-documents" > config/includes.chroot/etc/skel/Desktop/my-documents.desktop
            printf "%s\n" "[Desktop Entry]" "Type=Application" "Name=Recycle Bin" "Exec=thunar trash:///" "Icon=user-trash" > config/includes.chroot/etc/skel/Desktop/recycle-bin.desktop
            printf "%s\n" "[Desktop Entry]" "Type=Application" "Name=Remote Help (Call Son)" "Exec=rustdesk" "Icon=preferences-desktop-remote-desktop" > config/includes.chroot/etc/skel/Desktop/remote-help.desktop
            printf "%s\n" "[Desktop Entry]" "Type=Application" "Name=Software Store" "Exec=gnome-software" "Icon=org.gnome.Software" > config/includes.chroot/etc/skel/Desktop/software-store.desktop
            chmod +x config/includes.chroot/etc/skel/Desktop/*.desktop

            ln -sf /dev/null config/includes.chroot/etc/systemd/user/tracker-miner-fs-3.service

            mkdir -p config/hooks/live
            printf "%s\n" \
              "#!/bin/sh" \
              "set -e" \
              "export DEBIAN_FRONTEND=noninteractive" \
              "dpkg --add-architecture i386 || true" \
              "apt-get update -y || true" \
              "apt-get install -y --no-install-recommends wine32:i386 || true" \
              "curl -fsSL -o /tmp/rustdesk.deb \"https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb\" || true" \
              "if [ -f /tmp/rustdesk.deb ]; then apt-get install -y /tmp/rustdesk.deb || true; rm -f /tmp/rustdesk.deb; fi" > config/hooks/live/99-setup.hook.chroot
            chmod +x config/hooks/live/99-setup.hook.chroot

            # Build Universal Hybrid ISO
            lb build

            # Copy finished ISO to workspace
            find . -maxdepth 2 -name "*.iso" -exec cp {} /workspace/os-installer.iso \;
          '

      - name: Publish High-Speed Direct ISO Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Dad's OS (Windows XP Edition) Build #${{ github.run_number }}"
          body: "High-speed direct download for Dad's OS. Fully supports both modern UEFI and classic Legacy MBR/BIOS with full 1:1 Windows XP taskbar and Start button."
          files: os-installer.iso
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
